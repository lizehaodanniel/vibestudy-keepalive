name: Keep this repo active and restart the ping chain

# 两件事：
#  1) 公开仓库连续 60 天没有仓库活动，GitHub 会自动停掉所有定时任务
#     （官方文档 events-that-trigger-workflows#schedule）。超过 7 天才写一行
#     时间戳，让仓库一直算「有活动」，也不会一天 24 个垃圾提交。
#  2) 每小时无条件给 keepalive.yml 排一轮。GitHub 的 5 分钟 schedule 实测
#     一次都不触发，但 1 小时一次的低频任务通常能跑；它是自续链的**点火器**：
#     链活着时，concurrency 组只会把「之前排队的那轮」换掉，不会越滚越多；
#     链被整体取消时，这一轮就把链重新点着，不会一直睡到有人手动发现。
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: vibestudy-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Weekly activity stamp
        shell: bash
        run: |
          old_ts=0
          if [ -f LAST-ACTIVITY.txt ]; then
            old_ts=$(date -u -d "$(head -1 LAST-ACTIVITY.txt)" +%s 2>/dev/null || echo 0)
          fi
          now_ts=$(date -u +%s)
          if [ $((now_ts - old_ts)) -lt 604800 ]; then
            echo "离上次活动不到 7 天，不写提交"
            exit 0
          fi
          git config user.name "VibeStudy keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          date -u '+%Y-%m-%dT%H:%M:%SZ' > LAST-ACTIVITY.txt
          git add LAST-ACTIVITY.txt
          git commit -m "chore: weekly activity stamp" && git push

      - name: Ping now (backup)
        shell: bash
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -H 'User-Agent: VibeStudy-heartbeat/1.0 (GitHub Actions)' \
            'https://vibestudy-app.onrender.com/api/ping' || true)
          echo "heartbeat ping -> HTTP $code"

      - name: Re-ignite the chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true)
          echo "链补一轮 -> HTTP $code（204 = 已排上）"
