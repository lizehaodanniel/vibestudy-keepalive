name: Keep VibeStudy backend awake

# ══════════════════════════════════════════════════════════════════════════
# 2026-11-11 实测后的最终方案：**自续链**，不再依赖 GitHub 的 schedule。
#
# 起因：用户实报「点登录第一下特别慢」。Render 免费档 15 分钟没有入站请求
# 就休眠，醒来约 1 分钟。新建的公开仓库里每 5 分钟一次的 schedule，建仓后
# 1 小时 15 分本该跑 15 次，GitHub 实际跑了 **0 次**；而 workflow_dispatch
# 手动触发一直正常。GitHub 官方文档也只承诺 schedule 是 best-effort，
# 高峰期高频任务会被大量丢弃。把速度押在它上面就是假绿。
#
# 所以改成：每一轮用 GITHUB_TOKEN 触发下一轮 workflow_dispatch。GitHub 官方
# 明确写了 GITHUB_TOKEN 触发的事件默认不会新建 workflow run，但
# workflow_dispatch / repository_dispatch 是例外；再给 `actions: write`
# 权限即可。触发目标 workflow 文件必须在默认分支（这里是 main）。
# 一轮约 9 分钟，稳稳压在 Render 的 15 分钟以内。
#
# 公开仓库用标准 Linux runner 免费、不扣 Actions 额度（GitHub 官方计费文档）；
# 主仓库 VibeStudy 是私有的，GitHub Free 每月只有约 2000 分钟，扛不住这种频率。
# 这个仓库里没有产品代码、没有密钥，只有一个公开接口地址，可以安全公开。
#
# ⚠️ 链万一被整体取消（比如仓库设置变动），heartbeat.yml 每小时会无条件
#    再排一轮把它接上；它同时写 LAST-ACTIVITY.txt 防「60 天无活动停用定时任务」。
# ══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "1 = 这一轮结束后自动接上下一轮；0 = 只 ping 一次"
        required: false
        default: "1"

permissions:
  contents: read
  actions: write

# 同一时刻只允许一条链。cancel-in-progress: false 让下一轮**排队**而不是
# 把当前轮掐掉；GitHub 会取消「之前排队的那个」，所以 heartbeat 的补链
# 不会让链越滚越多。
concurrency:
  group: vibestudy-keepalive-chain
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping the free backend
        shell: bash
        run: |
          url="https://vibestudy-app.onrender.com/api/ping"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
              -H 'User-Agent: VibeStudy-keepalive/1.0 (GitHub Actions)' \
              "$url" || true)
            echo "ping $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 3
          done
          echo "这一轮没答上来（服务可能正在冷启动），下一轮接着戳，不标红刷屏"
          exit 0

      - name: Queue the next round
        if: ${{ github.event.inputs.chain != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main","inputs":{"chain":"1"}}' || true)
          echo "下一轮 dispatch -> HTTP $code（204 = 已排上）"
          # 排不上不标红：heartbeat 每小时还会补一次，别把 Actions 刷成一片红。

      # 先排下一轮再等，就算这一轮中途被取消，队列里那轮也还在。
      # 每分钟打一行，避免「长时间无输出」被判成卡死。
      - name: Hold about 9 minutes
        if: ${{ github.event.inputs.chain != '0' }}
        shell: bash
        run: |
          for i in $(seq 1 9); do
            echo "等待第 $i/9 分钟…"
            sleep 60
          done
          echo "这一轮结束，队列里的下一轮接着来"
